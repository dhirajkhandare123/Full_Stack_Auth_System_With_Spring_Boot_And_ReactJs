server:
  port: 8081


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/authapp
    username: root
    password: pass1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect


logging:
  level:
    org:
      springframework:
        security: DEBUG