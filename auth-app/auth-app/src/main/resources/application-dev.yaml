server:
  port: 8081


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/authapp
    username: root
    password: pass1234
    driver-class-name: com.mysql.cj.jdbc.Driver

#    hikari:
#      pool-name: HikariCP
